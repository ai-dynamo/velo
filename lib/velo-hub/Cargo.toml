[package]
name = "velo-hub"
version.workspace = true
edition.workspace = true
description = "A hub for velo applications: peer discovery, registration, and pluggable extensions"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
# Not published until a real port (kvbm's indexer and p2p as extensions)
# passes kvbm's lifecycle suite against this API. A published API frozen
# before that proof is the risk this gate exists for.
publish = false

[features]
default = []
# The hub server: store, registration, extensions, HTTP routes (axum).
server = [
    "dep:anyhow",
    "dep:axum",
    "dep:dashmap",
    "dep:futures",
    "dep:parking_lot",
    "dep:sha2",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
]
# The hub client: registration, discovery and extension calls (reqwest).
client = [
    "dep:anyhow",
    "dep:futures",
    "dep:parking_lot",
    "dep:reqwest",
    "dep:thiserror",
    "dep:tokio",
]
# The etcd store (`velo_hub::store::etcd`): registrations that survive a
# hub restart.
etcd = ["server", "dep:etcd-client"]
# The store conformance suite and a fault-injecting store, for backends and
# tests outside this crate.
test-support = ["server"]

[dependencies]
velo = { workspace = true }
# The wire protocol, built under every feature and re-exported as
# `velo_hub::protocol`.
velo-hub-ext = { workspace = true }

# The store and client types built on the wire types in velo-hub-ext.
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

# server
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# etcd
etcd-client = { workspace = true, optional = true }

# client. No TLS by default: a caller that needs it enables it on reqwest and
# passes its own client to `HubClientBuilder::http_client`.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"], optional = true }

[dev-dependencies]
# `test-helpers` exposes `Velo::primary_transport_key`, which the hooks
# suite reads to prove a failed registration leaves no velo peer behind.
velo = { workspace = true, features = ["test-helpers"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmp-serde = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["test-support"]

[[test]]
name = "heartbeat"
path = "tests/heartbeat.rs"
required-features = ["test-support"]

[[test]]
name = "registration_lifecycle"
path = "tests/registration_lifecycle.rs"
required-features = ["test-support"]

[[test]]
name = "hooks"
path = "tests/hooks.rs"
required-features = ["test-support"]

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
required-features = ["test-support"]

[[test]]
name = "client"
path = "tests/client.rs"
required-features = ["test-support", "client"]

[[test]]
name = "client_unregister"
path = "tests/client_unregister.rs"
required-features = ["test-support", "client"]

[[test]]
name = "services"
path = "tests/services.rs"
required-features = ["test-support", "client"]

[[test]]
name = "services_sync"
path = "tests/services_sync.rs"
required-features = ["test-support", "client"]

[[test]]
name = "store_etcd"
path = "tests/store_etcd.rs"
required-features = ["test-support", "etcd"]

[[test]]
name = "recovery_etcd"
path = "tests/recovery_etcd.rs"
required-features = ["test-support", "client", "etcd"]
