# Publish the mdBook in docs/ to GitHub Pages (https://ai-dynamo.github.io/velo/).
# Pull requests build the same book in the `Book` job of ci.yml, so a broken
# link fails before merge rather than here.
name: Pages

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push replaces a queued one, but a running
# deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
    - name: Configure Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - name: Build book
      env:
        INSTALL_TOOLS: "1"
      run: bash scripts/build-book.sh
    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: docs/book/html

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
