[book]
title = "Velo"
authors = ["Velo contributors"]
language = "en"
src = "src"

[build]
# A chapter listed in SUMMARY.md but missing on disk is an error, not an empty page.
create-missing = false

[output.html]
# GitHub Pages serves this project site under /velo/.
site-url = "/velo/"
git-repository-url = "https://github.com/ai-dynamo/velo"
edit-url-template = "https://github.com/ai-dynamo/velo/edit/main/docs/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.linkcheck]
follow-web-links = false
